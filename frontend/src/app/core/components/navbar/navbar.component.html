@if (shouldShowNavbar()) {
<div class="navbar-container">
  <p-menubar [model]="[]">
    <ng-template pTemplate="start">
      <a
        [routerLink]="CONSTANTS.ROUTES.HOME"
        class="logo-link"
        aria-label="Home"
      >
        <img
          ngSrc="assets/images/logo.png"
          alt="FamilyTree logo"
          width="48"
          height="48"
          class="logo-img"
          priority
        />
        <span class="logo-title">
          {{ logoTitle() }}
        </span>
      </a>
    </ng-template>

    <ng-template pTemplate="end">
      @if (isLoggedIn()) {
      <div class="nav-desktop">
        <div class="search-infield">
          <i class="pi pi-search"></i>
          <input
            pInputText
            type="text"
            [placeholder]="CONSTANTS.SEARCH_PLACEHOLDER | translate"
            [(ngModel)]="searchText"
            (keyup.enter)="submitSearch()"
          />
        <button type="button" class="search-btn" (click)="submitSearch()" [attr.aria-label]="CONSTANTS.SEARCH_PLACEHOLDER | translate">
          <i class="pi pi-arrow-right"></i>
        </button>
        </div>
        @if (canAccessAdmin()) {
        <button
          type="button"
          pButton
          class="admin-link"
          icon="pi pi-shield"
          (click)="goToAdmin()"
          [label]="CONSTANTS.ADMIN_NAV_LABEL | translate"
        ></button>
        }
        <button
          type="button"
          pButton
          class="notification-btn"
          (click)="openSharingRequests()"
          [attr.aria-label]="CONSTANTS.SHARING_REQUESTS_MENU | translate"
        >
          <i class="pi pi-bell"></i>
          @if (totalPending() > 0) {
          <span class="notification-count">{{ totalPending() }}</span>
          }
        </button>
        <!-- Settings menu button -->
        <p-menu
          #settingsMenu
          [model]="settingsItems"
          [popup]="true"
          appendTo="body"
        ></p-menu>
        <button
          pButton
          class="unified-btn settings-btn"
          (click)="settingsMenu.toggle($event)"
        >
          <i class="pi pi-chevron-down dropdown-icon"></i>
          <i class="pi pi-cog"></i>
          <span>{{ currentSettingsLabel }}</span>
        </button>

        <!-- Profile menu button -->
        <p-menu
          #profileMenu
          [model]="profileItems"
          [popup]="true"
          appendTo="body"
        ></p-menu>
        <button
          pButton
          class="unified-btn profile-btn"
          (click)="profileMenu.toggle($event)"
        >
          <i class="pi pi-chevron-down dropdown-icon"></i>
          <i class="pi pi-user"></i>
          <span>{{ CONSTANTS.AUTH_PROFILE | translate }}</span>
        </button>

        <!-- Language menu button -->
        <p-menu
          #langMenu
          [model]="langItems"
          [popup]="true"
          appendTo="body"
        ></p-menu>
        <button
          pButton
          class="unified-btn lang-btn"
          (click)="langMenu.toggle($event)"
        >
          <i class="pi pi-chevron-down dropdown-icon"></i>
          <i class="pi pi-globe"></i>
          <span>{{ currentLangLabel }}</span>
        </button>

        <button
          pButton
          label="{{ CONSTANTS.AUTH_LOGOUT | translate }}"
          icon="pi pi-sign-out"
          class="p-button-text logout-btn"
          (click)="logout()"
        ></button>
      </div>
      } @else {
      <div class="nav-desktop">
        <!-- Language menu button -->
        <p-menu
          #langMenuLoggedOut
          [model]="langItems"
          [popup]="true"
          appendTo="body"
        ></p-menu>
        <button
          pButton
          [label]="currentLangLabel"
          icon="pi pi-globe"
          class="unified-btn lang-btn"
          (click)="langMenuLoggedOut.toggle($event)"
        >
          <i class="pi pi-chevron-down dropdown-icon"></i>
        </button>

        <button
          pButton
          label="{{ CONSTANTS.AUTH_LOGIN | translate }}"
          icon="pi pi-sign-in"
          class="p-button-text"
          [routerLink]="CONSTANTS.ROUTES.LOGIN"
        ></button>
        <button
          pButton
          label="{{ CONSTANTS.AUTH_REGISTER | translate }}"
          icon="pi pi-user-plus"
          class="p-button-text"
          [routerLink]="CONSTANTS.ROUTES.REGISTER"
        ></button>
      </div>
      }

      <!-- Mobile toggle -->
      <div class="nav-mobile-toggle">
        <button
          type="button"
          pButton
          icon="pi pi-bars"
          class="hamburger-toggle p-button-rounded p-button-icon-only"
          (click)="mobileMenuVisible = !mobileMenuVisible"
          [attr.aria-expanded]="mobileMenuVisible"
          aria-label="Toggle Menu"
        ></button>
      </div>
    </ng-template>
  </p-menubar>

  @if (mobileMenuVisible) {
  <div class="nav-mobile-dropdown">
    @if (isLoggedIn()) {
          <!-- Mobile Search Box -->
    <div class="search-infield mobile-search">
      <i class="pi pi-search"></i>
      <input
        pInputText
        type="text"
        [placeholder]="CONSTANTS.SEARCH_PLACEHOLDER | translate"
        [(ngModel)]="searchText"
        (keyup.enter)="submitSearch()"
      />
      <button type="button" class="search-btn" (click)="submitSearch()" [attr.aria-label]="CONSTANTS.SEARCH_PLACEHOLDER | translate">
        <i class="pi pi-arrow-right"></i>
      </button>
    </div>
    @if (canAccessAdmin()) {
    <button
      type="button"
      pButton
      class="mobile-admin-btn"
      icon="pi pi-shield"
      (click)="goToAdmin()"
      [label]="CONSTANTS.ADMIN_NAV_LABEL | translate"
    ></button>
    }
    <button
      type="button"
      pButton
      class="mobile-notification-btn"
      (click)="openSharingRequests()"
      [attr.aria-label]="CONSTANTS.SHARING_REQUESTS_MENU | translate"
    >
      <i class="pi pi-bell"></i>
      @if (totalPending() > 0) {
      <span class="notification-count">{{ totalPending() }}</span>
      }
      <span class="mobile-notification-label">{{ CONSTANTS.SHARING_REQUESTS_MENU | translate }}</span>
    </button>
    <!-- Mobile Language Menu Button -->
    <p-menu
      #langMenuMobile
      [model]="langItems"
      [popup]="true"
      appendTo="body"
    ></p-menu>
    <button
      pButton
      [label]="currentLangLabel"
      icon="pi pi-globe"
      class="mobile-unified-btn"
      (click)="langMenuMobile.toggle($event)"
    >
      <i class="pi pi-chevron-down dropdown-icon"></i>
    </button>

    <!-- Mobile Settings Menu Button -->
    <p-menu
      #settingsMenuMobile
      [model]="settingsItems"
      [popup]="true"
      appendTo="body"
    ></p-menu>
    <button
      pButton
      [label]="currentSettingsLabel"
      icon="pi pi-cog"
      class="mobile-unified-btn"
      (click)="settingsMenuMobile.toggle($event)"
    >
      <i class="pi pi-chevron-down dropdown-icon"></i>
    </button>

    <!-- Mobile Profile Menu Button -->
    <p-menu
      #profileMenuMobile
      [model]="profileItems"
      [popup]="true"
      appendTo="body"
    ></p-menu>
    <button
      pButton
      [label]="CONSTANTS.AUTH_PROFILE | translate"
      icon="pi pi-user"
      class="mobile-unified-btn"
      (click)="profileMenuMobile.toggle($event)"
    >
      <i class="pi pi-chevron-down dropdown-icon"></i>
    </button>

    <button
      pButton
      label="{{ CONSTANTS.AUTH_LOGOUT | translate }}"
      icon="pi pi-sign-out"
      class="mobile-logout-btn"
      (click)="logout()"
    ></button>
    } @else {
    <!-- Mobile Language Menu Button -->
    <p-menu
      #langMenuMobileLoggedOut
      [model]="langItems"
      [popup]="true"
      appendTo="body"
    ></p-menu>
    <button
      pButton
      [label]="currentLangLabel"
      icon="pi pi-globe"
      class="mobile-unified-btn"
      (click)="langMenuMobileLoggedOut.toggle($event)"
    >
      <i class="pi pi-chevron-down dropdown-icon"></i>
    </button>

    <button
      pButton
      label="{{ CONSTANTS.AUTH_LOGIN | translate }}"
      icon="pi pi-sign-in"
      [routerLink]="CONSTANTS.ROUTES.LOGIN"
      (click)="mobileMenuVisible = false"
      class="mobile-auth-btn"
    ></button>
    <button
      pButton
      label="{{ CONSTANTS.AUTH_REGISTER | translate }}"
      icon="pi pi-user-plus"
      [routerLink]="CONSTANTS.ROUTES.REGISTER"
      (click)="mobileMenuVisible = false"
      class="mobile-auth-btn"
    ></button>
    }
  </div>
  }
</div>
}
