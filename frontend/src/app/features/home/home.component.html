<!-- Cytoscape container with color overlay -->
<div class="cy-wrapper" [class.hidden]="showTableView()">
  <!-- Overlay: controls only background color & its opacity -->
  <div
    class="bg-overlay"
    [style.backgroundImage]="backgroundUrl()"
    [style.backgroundSize]="'cover'"
    [style.backgroundPosition]="'center'"
    [style.opacity]="chartBackdropOpacityDisplay()"
  ></div>
  <div
    class="bg-overlay-dim"
    [class.bg-overlay-dim--on]="chartLinkDimActive()"
    aria-hidden="true"
  ></div>

  <!-- Actual Cytoscape canvas -->
  <div #cy class="cy-container"></div>
</div>

<app-home-control-panel
  class="control-panel d-flex flex-column gap-3 mb-3"
  [class.table-mode]="showTableView()"
  [showTableView]="showTableView()"
  [soundConsent]="soundConsent()"
  [soundPlaying]="soundPlaying()"
  [showConnections]="showConnections()"
  [showBirthInfo]="showBirthInfo()"
  [treeInvertVertical]="treeInvertVertical()"
  [circleSizeValue]="circleSizeValue"
  [textSizeValue]="textSizeValue"
  [backgroundOpacityValue]="backgroundOpacityValue"
  [distanceBoostXValue]="distanceBoostXValue"
  [distanceBoostYValue]="distanceBoostYValue"
  (viewToggled)="toggleView()"
  (soundToggled)="toggleAmbientSound()"
  (exportRequested)="openExportView()"
  (zoomInRequested)="zoomIn()"
  (zoomOutRequested)="zoomOut()"
  (backgroundDialogRequested)="openBackgroundDialog()"
  (photoDialogRequested)="openPhotoPickerDialog()"
  (connectionsToggled)="toggleConnections()"
  (birthInfoToggled)="toggleBirthInfo()"
  (treeInvertToggled)="toggleTreeInvertVertical()"
  (circleSizeChanged)="circleSizeValue = $event; updateCircleSize()"
  (textSizeChanged)="textSizeValue = $event; updateTextSize()"
  (backgroundOpacityChanged)="backgroundOpacityValue = $event; updateBackgroundOpacity()"
  (distanceBoostXChanged)="
    distanceBoostXValue = $event; updateDistanceBoostLayout()
  "
  (distanceBoostYChanged)="
    distanceBoostYValue = $event; updateDistanceBoostLayout()
  "
/>

<!-- Add Relative Dialog -->
@if (showAddDialog()) {
<app-add-relative-dialog
  [visible]="showAddDialog()"
  [baseMember]="selectedMember()!"
  (close)="onAddRelativeDialogClose()"
  (saved)="handleAddRelative($event)"
/>
}

<!-- Photo Picker Dialog -->
@if (showPhotoPickerDialog()) {
<app-photo-picker-dialog
  [visible]="showPhotoPickerDialog()"
  (close)="showPhotoPickerDialog.set(false)"
  (photoSelected)="handlePhotoSelection($event)"
/>
}

<!-- Background Picker Dialog -->
@if (showBackgroundDialog()) {
<app-background-picker-dialog
  [visible]="showBackgroundDialog()"
  (close)="showBackgroundDialog.set(false)"
  (backgroundSelected)="handleBackgroundSelection($event)"
/>
}

<!-- Hover Action Buttons on Node -->
@if (hoveredNode() && !showTableView()) {
<app-node-hover-actions
  [topPx]="hoveredNode()?.y"
  [leftPx]="hoveredNode()?.x"
  (addRequested)="openAddDialog(hoveredNode()?.id)"
  (editRequested)="editMember()"
/>
} @if (exportMode()) {
<app-export-overlay
  [exportBuilding]="exportBuilding()"
  [exportDataUrl]="exportDataUrl()"
  [exportMeta]="exportMeta()"
  (nudgeBg)="onExportNudge($event)"
  (resetBg)="resetBgOffset()"
  (downloadPng)="onDownloadPng()"
  (downloadPdf)="onDownloadPdf()"
  (close)="closeExportView()"
  (bgDragStart)="beginBgDrag($event)"
  (bgDragMove)="moveBgDrag($event)"
  (bgDragEnd)="endBgDrag()"
/>
}

<!-- Table View -->
<div class="table-container" [class.full-screen]="showTableView()">
  @if(showTableView()) {
  <app-tree-table
    [members]="members()"
    (addRelative)="openAddDialog($event.role)"
    (editMember)="handleEditFromTable($event)"
  ></app-tree-table>
  }
</div>
