<!-- navbar.component.html -->
@if (shouldShowNavbar()) {
<div class="navbar-container">
  <p-menubar [model]="[]">
    <ng-template pTemplate="start">
      <a
        [routerLink]="CONSTANTS.ROUTES.HOME"
        class="logo-link"
        aria-label="Home"
      >
        <img
          src="assets/images/logo.png"
          alt="FamilyTree logo"
          width="48"
          height="48"
          class="logo-img"
        />
      </a>
    </ng-template>

    <ng-template pTemplate="end">
      @if (isLoggedIn()) {
      <div class="nav-desktop">
        <!-- Settings split button -->
        <p-splitButton
          [label]="currentSettingsLabel"
          icon="pi pi-cog"
          [model]="settingsItems"
          styleClass="settings-split-btn"
          severity="secondary"
        ></p-splitButton>

        <!-- Profile split button -->
        <p-splitButton
          [label]="CONSTANTS.AUTH_PROFILE | translate"
          icon="pi pi-user"
          [model]="profileItems"
          styleClass="profile-split-btn"
          severity="secondary"
        ></p-splitButton>

        <!-- Language split button -->
        <p-splitButton
          [label]="currentLangLabel"
          icon="pi pi-globe"
          [model]="langItems"
          styleClass="lang-split-btn"
          severity="primary"
        ></p-splitButton>

        <button
          pButton
          label="{{ CONSTANTS.AUTH_LOGOUT | translate }}"
          icon="pi pi-sign-out"
          class="p-button-text logout-btn"
          (click)="logout()"
        ></button>
      </div>
      } @else {
      <div class="nav-desktop">
        <!-- Language split button -->
        <p-splitButton
          [label]="currentLangLabel"
          icon="pi pi-globe"
          [model]="langItems"
          styleClass="lang-split-btn"
          severity="primary"
        ></p-splitButton>

        <button
          pButton
          label="{{ CONSTANTS.AUTH_LOGIN | translate }}"
          icon="pi pi-sign-in"
          class="p-button-text"
          [routerLink]="CONSTANTS.ROUTES.LOGIN"
        ></button>
        <button
          pButton
          label="{{ CONSTANTS.AUTH_REGISTER | translate }}"
          icon="pi pi-user-plus"
          class="p-button-text"
          [routerLink]="CONSTANTS.ROUTES.REGISTER"
        ></button>
      </div>
      }

      <!-- Mobile toggle -->
      <div class="nav-mobile-toggle">
        <button
          type="button"
          pButton
          icon="pi pi-bars"
          class="hamburger-toggle p-button-rounded p-button-icon-only"
          (click)="mobileMenuVisible = !mobileMenuVisible"
          [attr.aria-expanded]="mobileMenuVisible"
          aria-label="Toggle Menu"
        ></button>
      </div>
    </ng-template>
  </p-menubar>

  @if (mobileMenuVisible) {
  <div class="nav-mobile-dropdown">
    @if (isLoggedIn()) {
    <!-- Mobile Language Split Button -->
    <p-splitButton
      [label]="currentLangLabel"
      icon="pi pi-globe"
      [model]="langItems"
      styleClass="mobile-split-btn"
      [style]="{ width: '100%' }"
    ></p-splitButton>

    <!-- Mobile Settings Split Button -->
    <p-splitButton
      [label]="currentSettingsLabel"
      icon="pi pi-cog"
      [model]="settingsItems"
      styleClass="mobile-split-btn"
      [style]="{ width: '100%' }"
    ></p-splitButton>

    <!-- Mobile Profile Split Button -->
    <p-splitButton
      [label]="CONSTANTS.AUTH_PROFILE | translate"
      icon="pi pi-user"
      [model]="profileItems"
      styleClass="mobile-split-btn"
      [style]="{ width: '100%' }"
    ></p-splitButton>

    <button
      pButton
      label="{{ CONSTANTS.AUTH_LOGOUT | translate }}"
      icon="pi pi-sign-out"
      class="mobile-logout-btn"
      (click)="logout()"
    ></button>
    } @else {
    <!-- Mobile Language Split Button -->
    <p-splitButton
      [label]="currentLangLabel"
      icon="pi pi-globe"
      [model]="langItems"
      styleClass="mobile-split-btn"
      [style]="{ width: '100%' }"
    ></p-splitButton>

    <button
      pButton
      label="{{ CONSTANTS.AUTH_LOGIN | translate }}"
      icon="pi pi-sign-in"
      [routerLink]="CONSTANTS.ROUTES.LOGIN"
      (click)="mobileMenuVisible = false"
      class="mobile-auth-btn"
    ></button>
    <button
      pButton
      label="{{ CONSTANTS.AUTH_REGISTER | translate }}"
      icon="pi pi-user-plus"
      [routerLink]="CONSTANTS.ROUTES.REGISTER"
      (click)="mobileMenuVisible = false"
      class="mobile-auth-btn"
    ></button>
    }
  </div>
  }
</div>
}
