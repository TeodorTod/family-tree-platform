<p-menubar [model]="[]" class="footer-menubar">
  >
  <ng-template pTemplate="start">
    <span class="text-sm text-muted">
      &copy; {{ currentYear }} Rodostoria. {{ CONSTANTS.COMMON_RIGHTS_RESERVED | translate }}
    </span>
  </ng-template>

  <ng-template pTemplate="end">
    <div class="d-flex align-center gap-2">
      <button
        pButton
        type="button"
        icon="pi pi-heart"
        class="p-button-rounded p-button-text my-icons"
        pTooltip="{{ CONSTANTS.COMMON_SUPPORT_US | translate }}"
        tooltipPosition="top"
        [routerLink]="[CONSTANTS.ROUTES.SUPPORT]"
        [attr.aria-label]="CONSTANTS.COMMON_SUPPORT_US | translate"
      ></button>
      <button
        pButton
        type="button"
        icon="pi pi-info-circle"
        class="p-button-rounded p-button-text my-icons"
        pTooltip="{{ CONSTANTS.COMMON_FAQ | translate }}"
        tooltipPosition="top"
        [routerLink]="['/faq']"
        aria-label="FAQ"
      ></button>
      <a
        pButton
        pRipple
        class="p-button-rounded p-button-text my-icons"
        [routerLink]="CONSTANTS.ROUTES.LEGAL.PRIVACY"
        pTooltip="{{ CONSTANTS.COMMON_PRIVACY_POLICY | translate }}"
        tooltipPosition="top"
        aria-label="Privacy Policy"
      >
        <i class="pi pi-shield" aria-hidden="true"></i>
      </a>
      <a
        pButton
        pRipple
        class="p-button-rounded p-button-text my-icons"
        [routerLink]="CONSTANTS.ROUTES.LEGAL.COOKIES"
        pTooltip="{{ CONSTANTS.COMMON_COOKIE_POLICY | translate }}"
        tooltipPosition="top"
        aria-label="Cookie Policy"
      >
        <span class="cookie-icon" aria-hidden="true"></span>
      </a>

      <a
        href="https://example.invalid"
        target="_blank"
        class="p-button p-button-icon-only p-button-rounded p-button-text my-icons"
        aria-label="Facebook"
      >
        <i class="pi pi-facebook"></i>
      </a>
      <a
        href="https://example.invalid"
        target="_blank"
        class="p-button p-button-icon-only p-button-rounded p-button-text my-icons"
        aria-label="Instagram"
      >
        <i class="pi pi-instagram"></i>
      </a>
    </div>
  </ng-template>
</p-menubar>
