<div class="global-search">
  <div class="search-bar">
    <input pInputText type="text" [placeholder]="CONSTANTS.SEARCH_PLACEHOLDER | translate" [ngModel]="q()" (ngModelChange)="q.set($event)" (keyup.enter)="onSubmit()" />
    <button pButton icon="pi pi-search" (click)="onSubmit()"></button>
  </div>

  <p-table [value]="results()" [loading]="loading()">
    <ng-template pTemplate="header">
      <tr>
        <th></th>
        <th>{{ CONSTANTS.COMMON_NAME | translate }}</th>
        <th>{{ CONSTANTS.COMMON_YEARS | translate }}</th>
        <th>{{ CONSTANTS.COMMON_STATUS | translate }}</th>
        <th>{{ CONSTANTS.COMMON_ACTIONS | translate }}</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>
          <img [src]="item.photoUrl || 'assets/images/user-image/user.svg'" width="40" height="40" />
        </td>
        <td>{{ item.firstName }} {{ item.lastName }}</td>
        <td>{{ item.birthYear || '' }} - {{ item.deathYear || '' }}</td>
        <td>
          <p-tag severity="warning" [value]="(CONSTANTS.SEARCH_REQUIRES_REQUEST | translate)"></p-tag>
        </td>
        <td>
          <button pButton size="small" label="{{ CONSTANTS.SEARCH_REQUEST_ACCESS | translate }}" (click)="requestAccess(item)"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <app-add-relative-dialog
    *ngIf="showAddDialog()"
    [visible]="showAddDialog()"
    [baseMember]="baseOwner"
    [clonedMemberId]="clonedMemberId!"
    (close)="showAddDialog.set(false)"
    (saved)="handleDialogSaved($event)"
  ></app-add-relative-dialog>
</div>
